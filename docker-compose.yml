# Savage Sun Rising — local infrastructure
# Product app (apps/web) uses Postgres. Legacy Blazor image is deprecated.
#
# Usage:
#   docker compose up -d
#   cd apps/web && copy .env.example .env
#   then install deps, prisma db push, and next dev (see root README)

services:
  postgres:
    image: postgres:16-alpine
    container_name: ssr-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ssr
      POSTGRES_DB: savage_sun_rising
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ssr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ssr -d savage_sun_rising']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ssr_pgdata:
