name: apps/web CI

# Build + typecheck the Next.js product app. No secrets, no deploy, no image push.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/**", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
